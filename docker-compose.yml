services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: rent-a-wheel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-rent_a_wheel}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rent-a-wheel-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rent-a-wheel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rent-a-wheel-network

  # Kafka (Optional - for background jobs)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rent-a-wheel-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rent-a-wheel-network
    profiles:
      - with-kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rent-a-wheel-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - rent-a-wheel-network
    profiles:
      - with-kafka

  # Express API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rent-a-wheel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-rent_a_wheel}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SENTRY_DSN: ${SENTRY_DSN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_MODE: ${CASHFREE_MODE:-sandbox}
    ports:
      - '4000:4000'
    networks:
      - rent-a-wheel-network
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist

  # Next.js CRM Application
  crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    container_name: rent-a-wheel-crm
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - '3000:3000'
    networks:
      - rent-a-wheel-network

  # React Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: rent-a-wheel-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3001:3001'
    networks:
      - rent-a-wheel-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  rent-a-wheel-network:
    driver: bridge
